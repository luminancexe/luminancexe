<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="auto">
  <defs>
    <linearGradient id="ld-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#04140e" />
      <stop offset="100%" stop-color="#010308" />
    </linearGradient>

    <linearGradient id="ld-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="ld-nebula" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="ld-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes ld-pulse-node {
      0%, 100% { opacity: 0.35; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }
    @keyframes ld-trace-sweep {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .ld-node { transform-origin: 90px 120px; animation: ld-pulse-node 3.5s ease-in-out infinite; }
    .ld-trace { stroke-dasharray: 6 6; animation: ld-trace-sweep 2.5s linear infinite; }
  </style>

  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#ld-card-bg)" stroke="url(#ld-border)" stroke-width="1.2" />
  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#ld-nebula)" />

  <g stroke="#10b981" stroke-width="1" stroke-opacity="0.6" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 568 24 L 568 12 L 556 12" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 568 216 L 568 228 L 556 228" />
  </g>

  <!-- Visual Art (Left Pane) - System Diagnostics Telemetry Matrix -->
  <g id="ld-visual">
    <circle cx="90" cy="120" r="62" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3 6" />

    <!-- Diagnostic Subsystem Hexagon Cluster -->
    <g class="ld-node" stroke="#10b981" stroke-width="1" fill="none">
      <polygon points="90,82 122,101 122,139 90,158 58,139 58,101" stroke-opacity="0.75" filter="url(#ld-glow)" />
      <circle cx="90" cy="120" r="14" fill="#022c22" stroke="#34d399" stroke-width="1.2" />
      <circle cx="90" cy="120" r="3" fill="#a7f3d0" />
    </g>

    <!-- Telemetry Heartbeat & Signal Traces -->
    <path d="M 45 120 L 70 120 L 78 100 L 86 140 L 94 110 L 102 125 L 110 120 L 135 120" fill="none" stroke="#34d399" stroke-width="1.4" class="ld-trace" filter="url(#ld-glow)" />

    <circle cx="90" cy="82" r="2.5" fill="#34d399" />
    <circle cx="122" cy="139" r="2.5" fill="#10b981" />
    <circle cx="58" cy="139" r="2.5" fill="#10b981" />
  </g>

  <line x1="172" y1="28" x2="172" y2="212" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Content Section -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace">
    <text x="190" y="38" font-size="9" font-weight="600" fill="#10b981" letter-spacing="1.5">
      EXPEDITION 05 // SYSTEMS &amp; TRIAGE
    </text>

    <g transform="translate(425, 26)">
      <rect x="0" y="0" width="135" height="18" rx="9" fill="#022c22" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.5" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="12.5" font-size="7.5" font-weight="600" fill="#a7f3d0" letter-spacing="1">TRIAGE ENGINE ACTIVE</text>
    </g>
  </g>

  <text x="190" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    LINUX DIAGNOSTICS
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="190" y="102">Automated Linux health check &amp; triage toolkit in Bash</text>
    <text x="190" y="120">with systemd service audits, boot blame analysis,</text>
    <text x="190" y="138">secure timestamped reports &amp; network diagnostics.</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#10b981">
    <rect x="190" y="172" width="105" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="242" y="186" text-anchor="middle">BASH / SHELL</text>

    <rect x="301" y="172" width="118" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="360" y="186" text-anchor="middle">LINUX SYSTEMS</text>

    <rect x="425" y="172" width="132" height="22" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="491" y="186" text-anchor="middle" fill="#d1fae5">SYSTEMD AUDIT</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">
    <text x="190" y="218" letter-spacing="1">ACCESS REPOSITORY →</text>
  </g>
</svg>
