      <circle cx="16" cy="15" r="3" fill="#818cf8" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">PHP &amp; Ecosystem</text>
