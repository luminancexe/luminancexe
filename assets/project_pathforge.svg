<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="auto">
  <defs>
    <linearGradient id="pf-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#14061e" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <linearGradient id="pf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="pf-nebula" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#be185d" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="pf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pf-wave {
      0% { r: 10; opacity: 0.8; }
      100% { r: 58; opacity: 0; }
    }
    @keyframes pf-path-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .pf-wave-ring { animation: pf-wave 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
    .pf-path-pulse { animation: pf-path-glow 2.5s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#pf-card-bg)" stroke="url(#pf-border)" stroke-width="1.2" />
  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#pf-nebula)" />

  <g stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 568 24 L 568 12 L 556 12" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 568 216 L 568 228 L 556 228" />
  </g>

  <!-- Visual Art (Left Pane) - Graph Wavefront & Algorithmic Tree Lattice -->
  <g id="pf-visual">
    <circle cx="90" cy="120" r="62" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="3 6" />

    <!-- Wavefront Expansion Rings -->
    <circle cx="90" cy="120" r="14" fill="none" stroke="#f43f5e" stroke-width="1.2" class="pf-wave-ring" />
    <circle cx="90" cy="120" r="28" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.4" />

    <!-- Graph Lattice Topology Edges -->
    <g stroke="#a855f7" stroke-width="0.7" stroke-opacity="0.35" fill="none">
      <line x1="50" y1="90" x2="90" y2="70" />
      <line x1="90" y1="70" x2="130" y2="90" />
      <line x1="50" y1="90" x2="60" y2="135" />
      <line x1="130" y1="90" x2="120" y2="135" />
      <line x1="60" y1="135" x2="90" y2="165" />
      <line x1="120" y1="135" x2="90" y2="165" />
      <line x1="90" y1="70" x2="90" y2="120" />
      <line x1="90" y1="120" x2="90" y2="165" />
    </g>

    <!-- Optimal Shortest-Path Traversal Vector -->
    <polyline points="50,90 90,70 90,120 120,135 90,165" fill="none" stroke="#f43f5e" stroke-width="1.8" filter="url(#pf-glow)" class="pf-path-pulse" />

    <!-- Graph Node Vertices (Min-Heap / Open-Set) -->
    <circle cx="90" cy="70" r="4" fill="#1e1035" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="50" cy="90" r="3" fill="#a855f7" />
    <circle cx="130" cy="90" r="3" fill="#a855f7" />
    <circle cx="60" cy="135" r="3" fill="#a855f7" />
    <circle cx="120" cy="135" r="3.5" fill="#f43f5e" />
    <circle cx="90" cy="120" r="4.5" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5" filter="url(#pf-glow)" />
    <circle cx="90" cy="165" r="4" fill="#22c55e" stroke="#86efac" stroke-width="1" filter="url(#pf-glow)" />
  </g>

  <line x1="172" y1="28" x2="172" y2="212" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Content Section -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace">
    <text x="190" y="38" font-size="9" font-weight="600" fill="#c084fc" letter-spacing="1.5">
      EXPEDITION 08 // ALGORITHMIC ENGINE
    </text>

    <g transform="translate(415, 26)">
      <rect x="0" y="0" width="145" height="18" rx="9" fill="#2e083a" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.5" />
      <circle cx="10" cy="9" r="2.5" fill="#c084fc">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="12.5" font-size="7.5" font-weight="600" fill="#f5d0fe" letter-spacing="1">WAVEFRONT ACTIVE</text>
    </g>
  </g>

  <text x="190" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    PATHFORGE
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="190" y="102">Graph pathfinding &amp; algorithmic wavefront engine in Java</text>
    <text x="190" y="120">featuring A* Search vs. Dijkstra, handcrafted heap &amp; list</text>
    <text x="190" y="138">data structures with real-time terrain visualization.</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#c084fc">
    <rect x="190" y="172" width="55" height="22" rx="4" fill="#2c0b38" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="217" y="186" text-anchor="middle">JAVA</text>

    <rect x="251" y="172" width="130" height="22" rx="4" fill="#2c0b38" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="316" y="186" text-anchor="middle">A* VS. DIJKSTRA</text>

    <rect x="387" y="172" width="105" height="22" rx="4" fill="#2c0b38" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="439" y="186" text-anchor="middle">DATA STRUCTURES</text>

    <rect x="498" y="172" width="58" height="22" rx="4" fill="#2c0b38" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="527" y="186" text-anchor="middle" fill="#fbcfe8">GRAPHS</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">
    <text x="190" y="218" letter-spacing="1">ACCESS REPOSITORY →</text>
  </g>
</svg>
