<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="auto">
  <defs>
    <linearGradient id="an-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#041224" />
      <stop offset="100%" stop-color="#010308" />
    </linearGradient>

    <linearGradient id="an-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="an-nebula" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="an-radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="an-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes an-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes an-beacon {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .an-rot { transform-origin: 90px 120px; animation: an-sweep 8s linear infinite; }
    .an-pulse { transform-origin: 90px 120px; animation: an-beacon 2.8s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#an-card-bg)" stroke="url(#an-border)" stroke-width="1.2" />
  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#an-nebula)" />

  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 568 24 L 568 12 L 556 12" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 568 216 L 568 228 L 556 228" />
  </g>

  <!-- Visual Art (Left Pane) - Aerospace Radar & Corridor Navigator -->
  <g id="an-visual">
    <!-- Radar Rings -->
    <circle cx="90" cy="120" r="62" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="3 5" />
    <circle cx="90" cy="120" r="42" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.4" />
    <circle cx="90" cy="120" r="22" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />

    <!-- Crosshair Cardinal Marks -->
    <line x1="28" y1="120" x2="152" y2="120" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="2 4" />
    <line x1="90" y1="58" x2="90" y2="182" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="2 4" />

    <!-- Rotating Radar Sweep Line -->
    <g class="an-rot">
      <line x1="90" y1="120" x2="148" y2="92" stroke="#38bdf8" stroke-width="1.6" filter="url(#an-glow)" />
      <polygon points="90,120 148,92 144,70" fill="url(#an-radar-sweep)" opacity="0.25" />
    </g>

    <!-- Flight Corridor Waypoint Path & Nodes -->
    <polyline points="48,150 72,130 90,120 125,95 140,75" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#an-glow)" />
    <circle cx="48" cy="150" r="2.5" fill="#f59e0b" />
    <circle cx="72" cy="130" r="2" fill="#38bdf8" />
    <circle cx="125" cy="95" r="2" fill="#38bdf8" />
    <circle cx="140" cy="75" r="3" fill="#22c55e" filter="url(#an-glow)" />

    <!-- Center Aerospace Orbiter Marker -->
    <g class="an-pulse">
      <polygon points="90,111 96,126 90,122 84,126" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.8" filter="url(#an-glow)" />
      <circle cx="90" cy="120" r="1.5" fill="#38bdf8" />
    </g>
  </g>

  <line x1="172" y1="28" x2="172" y2="212" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Content Section -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace">
    <text x="190" y="38" font-size="9" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      EXPEDITION 07 // AEROSPACE CORRIDORS
    </text>

    <g transform="translate(415, 26)">
      <rect x="0" y="0" width="145" height="18" rx="9" fill="#041f3d" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.5" />
      <circle cx="10" cy="9" r="2.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="9" dominant-baseline="central" font-size="7.5" font-weight="600" fill="#bae6fd" letter-spacing="1">FLIGHT ROUTER ACTIVE</text>
    </g>
  </g>

  <text x="190" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    ASTRANAV
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="190" y="102">Aerospace flight corridor optimizer &amp; pathfinder in Java</text>
    <text x="190" y="120">featuring multi-objective Dijkstra, A*, Yen's K-shortest,</text>
    <text x="190" y="138">interactive radar HUD &amp; dynamic airspace routing.</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#38bdf8">
    <rect x="190" y="172" width="56" height="22" rx="4" fill="#082244" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="218" y="183" dominant-baseline="central" text-anchor="middle">JAVA</text>

    <rect x="252" y="172" width="140" height="22" rx="4" fill="#082244" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="322" y="183" dominant-baseline="central" text-anchor="middle">DIJKSTRA &#8226; A* &#8226; YEN</text>

    <rect x="398" y="172" width="86" height="22" rx="4" fill="#082244" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="441" y="183" dominant-baseline="central" text-anchor="middle">RADAR HUD</text>

    <rect x="490" y="172" width="68" height="22" rx="4" fill="#082244" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="524" y="183" dominant-baseline="central" text-anchor="middle" fill="#bae6fd">ROUTING</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">
    <text x="190" y="218" letter-spacing="1">ACCESS REPOSITORY →</text>
  </g>
</svg>
