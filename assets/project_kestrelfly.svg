<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="auto">
  <defs>
    <linearGradient id="kf-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#03161c" />
      <stop offset="100%" stop-color="#010308" />
    </linearGradient>

    <linearGradient id="kf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="kf-nebula" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#065f46" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="kf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes kf-rotor {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes kf-target-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .kf-spin { transform-origin: 90px 120px; animation: kf-rotor 4s linear infinite; }
    .kf-target { transform-origin: 90px 120px; animation: kf-target-pulse 3s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#kf-card-bg)" stroke="url(#kf-border)" stroke-width="1.2" />
  <rect x="1" y="1" width="578" height="238" rx="12" fill="url(#kf-nebula)" />

  <g stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 568 24 L 568 12 L 556 12" />
    <path d="M 12 216 L 12 228 L 24 228" />
    <path d="M 568 216 L 568 228 L 556 228" />
  </g>

  <!-- Visual Art (Left Pane) - Tactical UAV Telemetry HUD & AI Target Tracker -->
  <g id="kf-visual">
    <!-- Outer Scope Ring -->
    <circle cx="90" cy="120" r="62" fill="none" stroke="#0891b2" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="3 5" />
    <circle cx="90" cy="120" r="44" fill="none" stroke="#06b6d4" stroke-width="0.7" stroke-opacity="0.4" />

    <!-- Attitude Horizon Ladder -->
    <line x1="56" y1="120" x2="74" y2="120" stroke="#06b6d4" stroke-width="1.2" />
    <line x1="106" y1="120" x2="124" y2="120" stroke="#06b6d4" stroke-width="1.2" />
    <line x1="68" y1="105" x2="80" y2="105" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="100" y1="105" x2="112" y2="105" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="68" y1="135" x2="80" y2="135" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="100" y1="135" x2="112" y2="135" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Drone Quadcopter Wireframe Arms -->
    <g stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6">
      <line x1="66" y1="96" x2="114" y2="144" />
      <line x1="66" y1="144" x2="114" y2="96" />
    </g>

    <!-- 4 Rotor Pods -->
    <circle cx="66" cy="96" r="8" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="2 3" />
    <circle cx="114" cy="96" r="8" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="2 3" />
    <circle cx="66" cy="144" r="8" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="2 3" />
    <circle cx="114" cy="144" r="8" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="2 3" />

    <!-- AI Target Bounding Box -->
    <g class="kf-target">
      <rect x="76" y="106" width="28" height="28" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4 2" filter="url(#kf-glow)" />
      <circle cx="90" cy="120" r="3" fill="#10b981" filter="url(#kf-glow)" />
    </g>

    <!-- Cardinal Ticks -->
    <circle cx="90" cy="58" r="1.5" fill="#06b6d4" />
    <circle cx="90" cy="182" r="1.5" fill="#06b6d4" />
    <circle cx="28" cy="120" r="1.5" fill="#06b6d4" />
    <circle cx="152" cy="120" r="1.5" fill="#06b6d4" />
  </g>

  <line x1="172" y1="28" x2="172" y2="212" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Content Section -->
  <g font-family="'JetBrains Mono', 'SF Mono', monospace">
    <text x="190" y="38" font-size="8.5" font-weight="600" fill="#06b6d4" letter-spacing="1.2">EXPEDITION 09 // AUTONOMOUS UAV</text>

    <g transform="translate(444, 26)">
      <rect x="0" y="0" width="116" height="18" rx="9" fill="#042f2e" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.5" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="9" dominant-baseline="central" font-size="7.5" font-weight="600" fill="#a7f3d0" letter-spacing="1">UAV LINK ONLINE</text>
    </g>
  </g>

  <text x="190" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    KESTRELFLY
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
    <text x="190" y="102">Autonomous UAV mission control &amp; telemetry dashboard</text>
    <text x="190" y="120">featuring geospatial waypoint mapping, AI computer vision,</text>
    <text x="190" y="138">Primary Flight Display HUD &amp; multi-drone fleet telemetry.</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#06b6d4">
    <rect x="190" y="172" width="82" height="22" rx="4" fill="#082e36" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="231" y="183" dominant-baseline="central" text-anchor="middle">TYPESCRIPT</text>

    <rect x="278" y="172" width="56" height="22" rx="4" fill="#082e36" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="306" y="183" dominant-baseline="central" text-anchor="middle">REACT</text>

    <rect x="340" y="172" width="96" height="22" rx="4" fill="#082e36" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="388" y="183" dominant-baseline="central" text-anchor="middle">MAPLIBRE GL</text>

    <rect x="442" y="172" width="116" height="22" rx="4" fill="#082e36" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.4" />
    <text x="500" y="183" dominant-baseline="central" text-anchor="middle" fill="#a7f3d0">UAV TELEMETRY</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">
    <text x="190" y="218" letter-spacing="1">ACCESS REPOSITORY →</text>
  </g>
</svg>
